[project]
name = "tomo-rag"
version = "0.1.0"
description = "Local RAG chatbot for scholarship application documents"
readme = "README.md"
authors = [
    { name = "Kunal Kumar Jena", email = "kunaljena115@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "openpyxl>=3.1.5",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tomo"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
